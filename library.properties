name=EspUsbHost
version=2.7.0
author=TANAKA Masayuki
maintainer=TANAKA Masayuki
sentence=USB Host library for ESP32-S3, ESP32-S2 and ESP32-P4 Arduino sketches.
paragraph=EspUsbHost processes USB events in a background FreeRTOS task, so loop() needs no polling call: register callbacks and call begin(). Supports HID keyboard with international layouts, mouse, gamepad, consumer and system control, keyboard LEDs and vendor reports, CDC ACM and FTDI/CP210x/CH34x USB serial adapters as Arduino Streams, USB MIDI in/out, USB Audio isochronous streaming, Mass Storage with FatFs/VFS and fs::FS access, CDC-NCM/CDC-ECM Ethernet adapters as raw frames or an lwIP interface, generic vendor bulk/control transfers, hubs, and multiple simultaneous devices.
category=Device Control
url=https://github.com/tanakamasayuki/EspUsbHost
architectures=esp32
includes=EspUsbHost.h
