profiles:
  # USBMode=hwcdc keeps Serial on the USB-Serial-JTAG port so the OTG HS port is
  # free for the host stack and the harness can read this board over its console.
  #
  # Deliberately not DebugLevel=verbose. With it, this board panics inside the
  # core's own console driver -- hw_cdc_isr_handler() in HWCDC.cpp, a store fault
  # in usb_serial_jtag_ll.h -- while the USB host is running, which takes the
  # console down with it and leaves the board needing a physical replug. The
  # library's own HCFG readback is logged at info level, so nothing this probe
  # reads is lost by staying below verbose.
  p4_fs_direct:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc,DebugLevel=info
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

default_profile: p4_fs_direct
