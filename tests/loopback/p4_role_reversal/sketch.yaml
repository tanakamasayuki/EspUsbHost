profiles:
  # Single ESP32-P4 running both roles at once, which needs its two USB
  # controllers wired for loopback. EspUsbDevice is pinned to a release: this
  # test is about EspUsbHost, and the device side must not drift under it.

  p4_loopback:
    fqbn: esp32:esp32:esp32p4
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbDevice (2.6.1)
  # The same board with PSRAM enabled, as EspUsbDevice's p4_psram combo.
  p4_psram:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,PSRAM=enabled,USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
      - EspUsbDevice (2.6.1)

default_profile: p4_loopback
