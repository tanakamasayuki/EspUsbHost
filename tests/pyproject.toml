[project]
name = "espusbhost-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-embedded>=2.0",
    "pytest-embedded-serial>=2.0",
    "pytest-embedded-arduino-cli>=1.6.0",
    "pytest-html>=4.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:record_xml_attribute is an experimental feature:pytest.PytestExperimentalApiWarning",
]
addopts = "--save-state"
# The default run is the automated layers. manual/ and probe/ are excluded by
# naming as well -- manual test files do not start with test_, and probe/ has no
# test files at all -- but saying so here means the default run does not depend
# on that staying true. Naming a path explicitly still overrides this, which is
# how a manual test is run: pytest manual/<name>/<name>.py
testpaths = ["harness", "unit", "peer"]
