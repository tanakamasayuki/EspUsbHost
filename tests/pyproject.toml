[project]
name = "espusbhost-tests"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "pytest>=8",
    "pytest-embedded>=2.0",
    "pytest-embedded-serial>=2.0",
    "pytest-embedded-arduino-cli>=1.12.0",
    "pytest-html>=4.1.1",
]

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:record_xml_attribute is an experimental feature:pytest.PytestExperimentalApiWarning",
]
addopts = "--save-state"
# Pairs fixed by wiring, for `--combo NAME` / `--combo all`. Without --combo each
# sketch runs on its default_profile as before. Ports come from .env:
# TEST_SERIAL_PORT_<PRIMARY> and TEST_SERIAL_PORT_PEER_DEVICE_<DEVICE>.
arduino_combos = [
    "s3: primary=s3_host,device=s3_device",
    "p4: primary=p4_loopback",
    "p4_psram: primary=p4_psram",
    "p4_p4x_hs: primary=p4_hs_host,device=p4x_hs_device",
    "p4x_p4_hs: primary=p4x_hs_host,device=p4_hs_device",
    "s3_s2: primary=s3b_host,device=s2_device",
    "s2_s3: primary=s2_host,device=s3b_device",
]
# No testpaths on purpose. What keeps manual/ and probe/ out of the default run
# is that their test files do not start with test_, and that is the whole rule.
# Declaring the paths as well would say the same thing a second way and add a
# failure the naming rule does not have: a layer added later would be left out
# silently, with the total unchanged so nothing looks different. It would also
# hide the mistake it is meant to guard -- a file wrongly named test_*.py under
# manual/ should join the run and be noticed, not be quietly skipped.
