profiles:
  # The device half of the throughput sweep. It is the same streaming sketch the
  # usb_vendor_read pairing uses, included from here rather than copied, but with
  # its own build_opt.h: the sweep needs a transmit FIFO and a per-write block far
  # larger than the correctness pairing, and build_opt.h reaches every profile of
  # the sketch it sits beside. Putting those flags next to the shared sketch once
  # broke the full-speed S3 pairing, which cannot use a 32 KB endpoint buffer.

  p4_hs_direct_device:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - EspUsbDevice (2.5.1)

default_profile: p4_hs_direct_device
