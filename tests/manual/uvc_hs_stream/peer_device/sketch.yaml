profiles:
  # The camera half of the high-speed UVC measurement. Its own sketch directory
  # rather than a reuse of tests/peer/usb_video/peer_device, because that one's
  # build_opt.h pins the isochronous payload to 112 bytes for a full-speed host
  # and build_opt.h reaches every profile of the sketch it sits beside. This one
  # deliberately takes the library default, which is 1023 bytes on an ESP32-P4.
  p4_hs_direct_device:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - EspUsbDevice (2.5.0)

default_profile: p4_hs_direct_device
