profiles:
  # The two-board ESP32-P4 rig, OTG HS to OTG HS over an A-A cable. The wiring is
  # temporary, so this profile is manual-only and is in no CI job. It reads
  # TEST_SERIAL_PORT_P4_HS_DIRECT rather than TEST_SERIAL_PORT_ESP32P4, so the rig
  # never takes over whichever single P4 is on the bench.
  #
  # USBMode=hwcdc keeps the test console on USB-Serial/JTAG while EspUsbHost uses
  # the OTG HS port; the P4 defaults route Serial to UART0 and pytest would see an
  # empty console after flashing.

  p4_hs_direct:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

default_profile: p4_hs_direct
