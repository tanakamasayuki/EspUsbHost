profiles:
  esp32p4:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

  esp32s3:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (4.0.0)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

default_profile: esp32p4
