profiles:
  s3_peer_device:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - EspUsbDevice (2.3.0)

# Pairs with p4_peer_host. Same console reasoning: the device stack drives the
# OTG port while Serial stays on the USB-Serial-JTAG one, so the harness can ask
# this board for DEVICE_READY while it is streaming. Not yet run.
  p4_peer_device:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - EspUsbDevice (2.3.0)

default_profile: s3_peer_device
