profiles:
  s3_peer_device:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - EspUsbDevice (2.3.0)

# Pairs with p4_peer_host. Same console reasoning: the device stack drives the
# OTG port while Serial stays on the USB-Serial-JTAG one, so the harness can ask
# this board for DEVICE_READY while it is streaming. Not yet run.
  p4_peer_device:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      # Working tree rather than the released 2.3.0, because the two-packet bulk
      # IN transmit FIFO is not in a release yet and both report version
      # "2.3.0" -- a pin by version silently builds the one-packet library and
      # the sweep then measures the device, not this host. The sketch prints
      # DEVICE_BULK_IN_DOUBLE_BUFFERED so a run shows which one it got. The S3
      # profile above stays on the release: it checks correctness, not rate.
      - dir: ../../../../../EspUsbDevice

default_profile: s3_peer_device
