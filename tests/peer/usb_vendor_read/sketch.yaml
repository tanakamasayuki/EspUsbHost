profiles:
  s3_peer_host:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

# High speed needs a P4 on both ends. The console options matter: USBMode=hwcdc
# puts Serial on the USB-Serial-JTAG port, which leaves the OTG HS port free for
# the host stack and lets the harness read this board over the same cable it
# flashes. Not yet run -- the pair available here is high-speed-wired for another
# experiment.
  p4_peer_host:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.11)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

default_profile: s3_peer_host
