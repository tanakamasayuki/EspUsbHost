profiles:
  s3_host:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
  s3b_host:
    fqbn: esp32:esp32:esp32s3:USBMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
  s2_host:
    fqbn: esp32:esp32:esp32s2
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
  p4_hs_host:
    fqbn: esp32:esp32:esp32p4:ChipVariant=prev3,USBMode=default,CDCOnBoot=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../
  p4x_hs_host:
    fqbn: esp32:esp32:esp32p4:ChipVariant=postv3,USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

# Outside the combos: the hand-wired ESP32-P4 HS pair used by
# manual/vendor_bulk_in_throughput and probe/. USBMode=hwcdc puts Serial on the
# USB-Serial-JTAG port, which leaves the OTG HS port free for the host stack.
  p4_peer_host:
    fqbn: esp32:esp32:esp32p4:USBMode=hwcdc,CDCOnBoot=cdc
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - dir: ../../../

default_profile: s3_host
